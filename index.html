<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learning JavaScript - ฝึก JavaScript ผ่านการเขียนและแบ่งปันความรู้สึก">
  <title>Learning JavaScript</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <div class="emoji" aria-hidden="true">💌</div>
    <h1>Learning JavaScript</h1>
    <p class="subtitle">ฝึกใช้ JavaScript ด้วยการเขียนและแบ่งปันความรู้สึก</p>
    <form id="feelingForm">
      <label for="name">ชื่อของคุณ</label>
      <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ" maxlength="80" required>
      <label for="feeling">ความรู้สึกของคุณ</label>
      <textarea id="feeling" name="feeling" rows="5" maxlength="2000" placeholder="เขียนความรู้สึกของคุณที่นี่..." required></textarea>
      <button type="submit">ส่งความรู้สึก <span aria-hidden="true">→</span></button>
    </form>
    <p class="privacy-note">เมื่อกดส่ง ข้อมูลจะแสดงในหน้าถัดไป โดยใช้ sessionStorage ในเบราว์เซอร์นี้</p>
  </main>
</body>
</html>
