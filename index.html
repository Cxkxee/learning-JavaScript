<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กลุ่มอนุบาลพล 👾</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: rgba(240,240,240,0.45);
    --c: #c8ff00;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Kanit', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(110px); opacity: 0.09; pointer-events: none; z-index: 0; }
  .b1 { width: 500px; height: 500px; background: #ff3cac; top: -150px; left: -150px; }
  .b2 { width: 400px; height: 400px; background: #00d4ff; bottom: -100px; right: -100px; }

  /* ── APP SHELL ── */
  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; gap: 1rem;
  }
  .logo-title {
    font-size: 1.2rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1;
  }
  .logo-sub {
    font-size: 0.6rem; font-family: 'Space Mono', monospace;
    color: #c8ff00; letter-spacing: 0.1em; margin-top: 2px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 100px; padding: 5px 12px;
    font-size: 0.68rem; color: var(--muted); font-family: 'Space Mono', monospace;
    white-space: nowrap; flex-shrink: 0;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c8ff00; animation: pulse 2s ease-in-out infinite; flex-shrink: 0; }

  /* ── BODY ── */
  .body-wrap {
    display: flex; flex: 1; overflow: hidden;
  }

  /* ── LEFT LIST ── */
  .sidebar {
    width: 260px; flex-shrink: 0;
    overflow-y: auto; padding: 1rem;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .m-row {
    display: flex; align-items: center; gap: 12px;
    padding: 0.7rem 0.85rem;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative; overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
  .m-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--rc, #c8ff00);
    transform: scaleY(0); transform-origin: center; transition: transform 0.2s;
    border-radius: 0 3px 3px 0;
  }
  .m-row:hover::before, .m-row.active::before { transform: scaleY(1); }
  .m-row:hover { border-color: var(--rc, #c8ff00); transform: translateX(3px); }
  .m-row.active { border-color: var(--rc, #c8ff00); background: rgba(255,255,255,0.04); }

  .m-ava {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--rc, #c8ff00);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; position: relative; overflow: hidden;
  }
  .m-ava img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .m-online {
    position: absolute; bottom: 1px; right: 1px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #c8ff00; border: 2px solid var(--card);
  }
  .m-info { flex: 1; min-width: 0; }
  .m-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-nick { font-size: 0.67rem; font-family: 'Space Mono', monospace; color: var(--rc, #c8ff00); }
  .m-arr { font-size: 0.8rem; color: var(--muted); transition: transform 0.2s, color 0.2s; flex-shrink: 0; }
  .m-row:hover .m-arr, .m-row.active .m-arr { transform: translateX(3px); color: var(--rc, #c8ff00); }

  /* stagger */
  .m-row:nth-child(1){animation-delay:.05s} .m-row:nth-child(2){animation-delay:.10s}
  .m-row:nth-child(3){animation-delay:.15s} .m-row:nth-child(4){animation-delay:.20s}
  .m-row:nth-child(5){animation-delay:.25s} .m-row:nth-child(6){animation-delay:.30s}
  .m-row:nth-child(7){animation-delay:.35s} .m-row:nth-child(8){animation-delay:.40s}
  .m-row:nth-child(9){animation-delay:.45s} .m-row:nth-child(10){animation-delay:.50s}
  .m-row:nth-child(11){animation-delay:.55s} .m-row:nth-child(12){animation-delay:.60s}
  .m-row:nth-child(13){animation-delay:.65s} .m-row:nth-child(14){animation-delay:.70s}
  .m-row:nth-child(15){animation-delay:.75s}

  /* ── RIGHT PANEL ── */
  .detail {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
  }
  .detail::-webkit-scrollbar { width: 3px; }
  .detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* empty */
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); text-align: center; padding: 2rem;
  }
  .empty-icon { font-size: 2.5rem; opacity: 0.25; }
  .empty-txt { font-size: 0.85rem; font-weight: 300; line-height: 1.7; }

  /* content */
  .dc {
    display: none; flex-direction: column; flex: 1;
    animation: slideIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
  }
  .dc.on { display: flex; }

  /* ── HERO: name centered + circle photo ── */
  .hero {
    position: relative;
    padding: 2.5rem 1.5rem 0;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    overflow: hidden;
  }
  /* subtle bg glow behind hero */
  .hero-glow {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 400px; border-radius: 50%;
    filter: blur(80px); opacity: 0.1; pointer-events: none;
    background: var(--rc, #c8ff00);
  }

  /* num badge */
  .h-num {
    position: absolute; top: 1rem; right: 1.25rem;
    font-family: 'Space Mono', monospace; font-size: 0.62rem;
    color: var(--muted); background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px;
  }

  /* big name */
  .h-name {
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 900; letter-spacing: -0.03em; line-height: 1.05;
    margin-bottom: 1.75rem; position: relative; z-index: 1;
  }

  /* circle photo */
  .h-circle {
    width: clamp(140px, 28vw, 200px);
    height: clamp(140px, 28vw, 200px);
    border-radius: 50%;
    border: 3px solid var(--rc, #c8ff00);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.04), 0 0 40px -8px var(--rc, #c8ff00);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(3rem, 8vw, 5rem);
    overflow: hidden; position: relative; z-index: 1;
    transition: box-shadow 0.3s;
  }
  .h-circle img { width: 100%; height: 100%; object-fit: cover; }

  /* photo upload overlay */
  .photo-overlay {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.4rem; color: #fff; gap: 4px;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .photo-overlay span { font-size: 0.65rem; font-family: 'Kanit', sans-serif; font-weight: 600; letter-spacing: 0.05em; }
  .h-circle:hover .photo-overlay { opacity: 1; }

  /* accent line below circle */
  .h-line {
    width: 100%; height: 1px; margin-top: 2rem;
    background: linear-gradient(90deg, transparent, var(--rc, #c8ff00) 40%, transparent);
    position: relative; z-index: 1;
  }

  /* ── BODY BELOW ── */
  .db { padding: 1.5rem 1.75rem 2.5rem; }

  .d-nick {
    font-size: 0.8rem; font-family: 'Space Mono', monospace;
    color: var(--rc, #c8ff00); margin-bottom: 1rem;
  }
  .d-nick::before { content: '@ '; }

  .d-bio {
    font-size: 0.88rem; font-weight: 300;
    color: rgba(240,240,240,0.75); line-height: 1.75;
    margin-bottom: 1.5rem;
    padding: 0.9rem 1.1rem;
    background: rgba(255,255,255,0.03);
    border-left: 2px solid var(--rc, #c8ff00);
    border-radius: 0 10px 10px 0;
  }

  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;
    margin-bottom: 1.5rem;
  }
  .ib {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 11px; padding: 0.75rem 0.9rem;
  }
  .ib:last-child {
    grid-column: 1 / -1;
    background: transparent; border: none; padding: 0;
  }
  .ib-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 3px; font-family: 'Space Mono', monospace; }
  .ib-val { font-size: 0.85rem; font-weight: 600; }

  .tags-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-family: 'Space Mono', monospace; margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
  .tag {
    font-size: 0.72rem; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 100px;
    padding: 4px 11px; color: var(--muted);
  }
  .tag.hi { border-color: var(--rc, #c8ff00); color: var(--rc, #c8ff00); }

  .qbox {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 13px; padding: 1.1rem 1.3rem; position: relative; overflow: hidden;
  }
  .qbox::before {
    content: '"'; position: absolute; top: -0.5rem; left: 0.6rem;
    font-size: 5rem; color: var(--rc, #c8ff00); opacity: 0.12;
    line-height: 1; font-family: Georgia, serif;
  }
  .q-text { font-size: 0.85rem; font-weight: 300; line-height: 1.7; color: rgba(240,240,240,0.8); font-style: italic; }
  .q-author { font-size: 0.68rem; color: var(--rc, #c8ff00); font-family: 'Space Mono', monospace; margin-top: 7px; }

  /* ── MUSIC PLAYER ── */
  .music-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 13px; padding: 0.9rem 1rem;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: border-color 0.2s, transform 0.15s;
    position: relative; overflow: hidden;
  }
  .music-card:hover { border-color: var(--rc, #c8ff00); transform: translateY(-1px); }
  .music-card.playing { border-color: var(--rc, #c8ff00); }
  .music-play-btn {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: var(--rc, #c8ff00); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: transform 0.15s, opacity 0.2s;
    color: #000;
  }
  .music-play-btn:hover { transform: scale(1.08); opacity: 0.9; }
  .music-info { flex: 1; min-width: 0; }
  .music-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-artist { font-size: 0.7rem; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-wave {
    display: flex; align-items: center; gap: 2px; height: 20px; flex-shrink: 0;
  }
  .music-wave span {
    display: block; width: 3px; border-radius: 2px;
    background: var(--rc, #c8ff00); opacity: 0.5;
    transition: height 0.2s;
  }
  .music-card.playing .music-wave span { opacity: 1; }
  @keyframes wave1 { 0%,100%{height:4px} 50%{height:16px} }
  @keyframes wave2 { 0%,100%{height:10px} 50%{height:6px} }
  @keyframes wave3 { 0%,100%{height:6px} 50%{height:18px} }
  @keyframes wave4 { 0%,100%{height:14px} 50%{height:4px} }
  .music-card.playing .music-wave span:nth-child(1) { animation: wave1 0.8s ease-in-out infinite; }
  .music-card.playing .music-wave span:nth-child(2) { animation: wave2 0.9s ease-in-out infinite; }
  .music-card.playing .music-wave span:nth-child(3) { animation: wave3 0.7s ease-in-out infinite; }
  .music-card.playing .music-wave span:nth-child(4) { animation: wave4 1s ease-in-out infinite; }

  /* ── MOBILE OVERLAY ── */
  /* on mobile the sidebar becomes a bottom sheet trigger, detail is fullscreen */
  .mob-bar {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 0.75rem 1rem 1rem;
  }
  .mob-scroll {
    display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 4px;
  }
  .mob-scroll::-webkit-scrollbar { display: none; }
  .mob-chip {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    flex-shrink: 0; cursor: pointer;
  }
  .mob-ava {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; overflow: hidden; transition: border-color 0.2s;
  }
  .mob-ava img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .mob-chip.active .mob-ava { border-color: var(--rc, #c8ff00); box-shadow: 0 0 10px -2px var(--rc, #c8ff00); }
  .mob-lbl { font-size: 0.62rem; color: var(--muted); font-family: 'Space Mono', monospace; white-space: nowrap; }
  .mob-chip.active .mob-lbl { color: var(--rc, #c8ff00); }

  /* back button mobile */
  .back-btn {
    display: none;
    position: fixed; top: 0.75rem; left: 1rem; z-index: 60;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 100px;
    padding: 6px 14px; font-size: 0.78rem; color: var(--text);
    cursor: pointer; align-items: center; gap: 6px;
    font-family: 'Kanit', sans-serif;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    html, body { overflow: hidden; }
    .sidebar { display: none; }
    .mob-bar { display: block; }
    .back-btn { display: flex; }
    header { padding: 0.75rem 1rem; }
    .logo-title { font-size: 1rem; }
    .pill { display: none; }
    .body-wrap { flex-direction: column; }
    .detail { padding-bottom: 100px; }
    .empty { padding-top: 4rem; }
    .db { padding: 1.25rem 1.25rem 2rem; }
    .hero { padding: 3.5rem 1.25rem 0; }
    .h-name { font-size: 1.6rem; }
    .info-grid { grid-template-columns: 1fr; }
  }

  /* anims */
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
</style>
</head>

    <div>

  <!-- MOBILE bottom strip -->
  <div class="mob-bar"><div class="mob-scroll" id="mobScroll"></div></div>

</div>

<!-- mobile back btn -->
<button class="back-btn" id="backBtn" onclick="closeMob()">← กลับ</button>

let activeId = null;
const isMob = () => window.innerWidth <= 640;

let currentAudio = null;
let currentPlayingUrl = null;

function togglePlay(url, btn) {
  const card = btn.closest('.music-card');

  // ถ้าไม่มี URL → ไม่ทำอะไร
  if (!url) {
    btn.title = 'ยังไม่มีลิงก์เพลง';
    return;
  }

  // ถ้าเพลงนี้กำลังเล่น → หยุด
  if (currentPlayingUrl === url && currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    btn.textContent = '▶';
    card.classList.remove('playing');
    currentPlayingUrl = null;
    return;
  }

  // หยุดเพลงเก่า
  if (currentAudio) {
    currentAudio.pause();
    document.querySelectorAll('.music-play-btn').forEach(b => b.textContent = '▶');
    document.querySelectorAll('.music-card').forEach(c => c.classList.remove('playing'));
  }

  // เล่นเพลงใหม่
  currentAudio = new Audio(url);
  currentAudio.play().catch(() => {
    btn.textContent = '▶';
    alert('โหลดเพลงไม่ได้ — ตรวจสอบ URL อีกครั้งครับ');
  });
  btn.textContent = '⏸';
  card.classList.add('playing');
  currentPlayingUrl = url;
  currentAudio.onended = () => {
    btn.textContent = '▶';
    card.classList.remove('playing');
    currentPlayingUrl = null;
  };
}

function avatarHTML(m, size) {
  if (m.photo) return `<img src="${m.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  return `<span style="font-size:${size}">${m.emoji}</span>`;
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  members.forEach(m => {
    const c = CM[m.col];
    const row = document.createElement('div');
    row.className = 'm-row'; row.dataset.id = m.id;
    row.style.setProperty('--rc', c);
    row.innerHTML = `
      <div class="m-ava" style="border-color:${c}">
        ${avatarHTML(m,'1.3rem')}
        <div class="m-online"></div>
      </div>
      <div class="m-info">
        <div class="m-name">${m.name}</div>
        <div class="m-nick" style="color:${c}">@ ${m.nick}</div>
      </div>
      <div class="m-arr">›</div>`;
    row.addEventListener('click', () => open(m));
    sb.appendChild(row);
  });
}

function buildMob() {
  const ms = document.getElementById('mobScroll');
  members.forEach(m => {
    const c = CM[m.col];
    const chip = document.createElement('div');
    chip.className = 'mob-chip'; chip.dataset.id = m.id;
    chip.style.setProperty('--rc', c);
    chip.innerHTML = `
      <div class="mob-ava" style="border-color:${c}">${avatarHTML(m,'1.4rem')}</div>
      <div class="mob-lbl" style="color:${c}">@ ${m.nick}</div>`;
    chip.addEventListener('click', () => open(m));
    ms.appendChild(chip);
  });
}

function open(m) {
  activeId = m.id;
  const c = CM[m.col];

  // sidebar highlight
  document.querySelectorAll('.m-row').forEach(r => r.classList.toggle('active', +r.dataset.id === m.id));
  // mob highlight
  document.querySelectorAll('.mob-chip').forEach(r => {
    r.classList.toggle('active', +r.dataset.id === m.id);
    r.style.setProperty('--rc', CM[members.find(x=>x.id===+r.dataset.id).col]);
  });

  // set color var on detail elements
  const dc = document.getElementById('dc');
  dc.style.setProperty('--rc', c);

  // hero
  document.getElementById('hGlow').style.background = c;
  document.getElementById('hNum').textContent = `#00${m.id}`;
  document.getElementById('hName').textContent = m.name;
  // hero circle — ใช้ photo URL จาก members data
  const circle = document.getElementById('hCircle');
  circle.style.borderColor = c;
  circle.style.boxShadow = `0 0 0 6px rgba(255,255,255,0.04), 0 0 40px -8px ${c}`;
  circle.style.cursor = 'default';
  if (m.photo) {
    circle.innerHTML = `<img src="${m.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  } else {
    circle.innerHTML = `<span style="font-size:clamp(3rem,8vw,5rem);filter:drop-shadow(0 0 20px ${c}80)">${m.emoji}</span>`;
  }

  // body
  const nick = document.getElementById('dNick');
  nick.style.color = c; nick.textContent = m.nick;

  document.getElementById('dGrid').innerHTML = `
    <div class="ib"><div class="ib-label">คณะ</div><div class="ib-val">${m.faculty}</div></div>
    <div class="ib"><div class="ib-label">มหาวิทยาลัย</div><div class="ib-val" style="font-size:0.78rem">${m.uni}</div></div>
    <div class="ib"><div class="ib-label">ชั้นปี</div><div class="ib-val" style="color:${c}">${m.year}</div></div>
    <div class="ib">
      <div class="ib-label">เพลงที่ชอบ 🎵</div>
      <div class="music-card" id="mc-${m.id}">
        <div class="music-play-btn" id="mpb-${m.id}" style="background:${c}">▶</div>
        <div class="music-info">
          <div class="music-title">${m.song}</div>
          <div class="music-artist">${m.songArtist}</div>
        </div>
        <div class="music-wave">
          <span style="background:${c}"></span>
          <span style="background:${c}"></span>
          <span style="background:${c}"></span>
          <span style="background:${c}"></span>
        </div>
      </div>
    </div>`;

  // ผูก event หลัง render
  const card = document.getElementById(`mc-${m.id}`);
  const btn  = document.getElementById(`mpb-${m.id}`);
  card.addEventListener('click', () => togglePlay(m.songUrl, btn));

  document.getElementById('dTags').innerHTML = m.tags.map(t =>
    `<span class="tag ${t===m.hi?'hi':''}" style="${t===m.hi?`border-color:${c};color:${c}`:''}}">${t}</span>`).join('');

  document.getElementById('qText').textContent = m.quote;
  const qa = document.getElementById('qAuth');
  qa.style.color = c; qa.textContent = `— ${m.nick}`;

  // show
  document.getElementById('emptyState').style.display = 'none';
  const dcEl = document.getElementById('dc');
  dcEl.classList.remove('on'); void dcEl.offsetWidth; dcEl.classList.add('on');

  // mobile: show back btn, scroll to top
  if (isMob()) {
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('detail').scrollTop = 0;
  }
}

function closeMob() {
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('dc').classList.remove('on');
  document.getElementById('emptyState').style.display = 'flex';
  document.querySelectorAll('.mob-chip').forEach(r => r.classList.remove('active'));
  activeId = null;
}

buildSidebar();
buildMob();
</script>
